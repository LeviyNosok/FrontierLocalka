- type: entity
  parent: [ BaseC1Contraband, ClothingHeadHelmetSPT ]
  id: ClothingHeadHelmetHardsuitSPT
  name: SPT hardsuit helmet
  description: A special hardsuit helmet worn by members of an special paramedical team.
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/SPThelm.rsi
  - type: Clothing
    sprite: Forge/Clothing/Head/Hardsuits/SPThelm.rsi
  - type: PointLight
    color: "#adffe1"

- type: entity
  parent: [ ClothingHeadSuitWithLightBase, ClothingHeadEVAHelmetBase ] #Despite acting like a hardsuit helmet, since it inherits from EVA Helmet, it goes here.
  id: ClothingHeadHelmetSPT
  name: paramedic void helmet
  description: A void helmet made for paramedics.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Forge/Clothing/Head/Hardsuits/paramedhelm.rsi #Corvax-Frontier-Resprite
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
      head-vox:
      - state: equipped-head-light-vox
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      head-vox:
      - state: equipped-head-vox
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: PointLight
    radius: 5
    energy: 2
    color: "#00ffff"